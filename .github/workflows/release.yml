# Tag-triggered release (ADR6.1): every v* tag runs the check tier, cross-
# compiles both darwin architectures with CGO_ENABLED=0 (no macOS runner
# needed), and uploads the tarballs plus checksums.txt to a GitHub Release.
# Installation is downloading from the Releases page — gh release download
# and curl never set the quarantine xattr, so no notarisation is needed.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Makefile bootstraps its own pinned Go toolchain into tmp/.
      - name: Check
        run: make check

      - name: Build distribution artifacts
        run: make dist VERSION=${{ github.ref_name }} BUILT_BY=github-actions

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "screenz ${{ github.ref_name }}" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
