# Architecture Decision Record - structured form of adrs/0008-strict-tolerance-verification.md
id: ADR-0008
slug: strict-tolerance-verification
plan_id: ADR3.1
title: Fail strictly on a mismatched frame, with a numeric tolerance
description: Verification is never off; widen numerically and deliberately
status: accepted
accepted_on: 2026-08-28
last_changed_on: 2026-08-28
tags: [placement, verification]

lens: |-
  Verification is never off. A rule may widen its tolerance numerically and deliberately;
  nothing may disable the check.

provenance: Rectangle bug history (no read back) plus the spike fact that AX rounds sizes to whole points
enforced_in:
  - internal/layout (Tolerance)
  - internal/place (read back)
  - internal/cli apply exit codes

relates_to:
  - relation: see_also
    target: ADR-0010
    note: covers the retry before the verdict

problem:
  symptom: "AX set-frame is a proposal: apps clamp to minimum sizes and aspect ratios silently, and the call still returns success."
  pain_point: A silently clamped window reported as placed is the canonical false success; without read back the tool cannot be trusted at all.

decision:
  given: apps clamp frames silently and AX rounds requested sizes to whole points
  we_prefer: comparing every edge of the read-back frame against a per-rule numeric tolerance (points, or percent of the target size per axis; default 0.5 pt), over always-strict or a boolean tolerant switch
  because: the default only absorbs AX rounding, while a known fixed-size app can widen its own rule without turning verification off for everything
  unless: never; the check can be widened but not disabled, so infinite and NaN tolerances are rejected at parse time
  in_practice:
    - Any edge outside tolerance marks the window clamped and the run exits 1 with requested versus actual.
    - The stale error from a failed attempt is cleared so the verdict describes the final attempt only.

consequences:
  pros:
    - Exit 0 is a real guarantee about where every window sits.
  cons:
    - Minimum-sized windows need a deliberate per-rule tolerance to go green.
