-ADR-0011", "source": "ADR-0021", "target": "ADR-0011", "label": "extends", "relation": "extends", "note": "adds a second spelling of each rule flag without changing what a rule is"}}, {"data": {"id": "ADR-0021-see_also-ADR-0013", "source": "ADR-0021", "target": "ADR-0013", "label": "see also", "relation": "see_also", "note": "stdlib flag is why aliases are a second registration and why -mdr grouping does not exist"}}, {"data": {"id": "ADR-0021-see_also-ADR-0024", "source": "ADR-0021", "target": "ADR-0024", "label": "see also", "relation": "see_also", "note": "the same one-letter treatment, applied to the command word rather than to its flags"}}, {"data": {"id": "ADR-0022-see_also-ADR-0020", "source": "ADR-0022", "target": "ADR-0020", "label": "see also", "relation": "see_also", "note": "the defaulted region is stored in canonical spelling like any other"}}, {"data": {"id": "ADR-0022-extended_by-ADR-0023", "source": "ADR-0022", "target": "ADR-0023", "label": "extended by", "relation": "extended_by", "note": "shorthand codes reuse this canonicalise-at-the-door rule for a second class of alias"}}, {"data": {"id": "ADR-0023-extends-ADR-0022", "source": "ADR-0023", "target": "ADR-0022", "label": "extends", "relation": "extends", "note": "reuses that record's canonicalise-at-the-door rule for a second class of alias"}}, {"data": {"id": "ADR-0024-extends-ADR-0013", "source": "ADR-0024", "target": "ADR-0013", "label": "extends", "relation": "extends", "note": "adds a second case label per command to the hand-rolled dispatch table, with no parser change"}}, {"data": {"id": "ADR-0024-see_also-ADR-0021", "source": "ADR-0024", "target": "ADR-0021", "label": "see also", "relation": "see_also", "note": "the same one-letter treatment, applied to the command word rather than to its flags"}}, {"data": {"id": "ADR-0024-extended_by-ADR-0025", "source": "ADR-0024", "target": "ADR-0025", "label": "extended by", "relation": "extended_by", "note": "changes which commands exist; the initial-as-short-name rule here is unchanged"}}, {"data": {"id": "ADR-0025-see_also-ADR-0016", "source": "ADR-0025", "target": "ADR-0016", "label": "see also", "relation": "see_also", "note": "its no-capture rule stands unchanged; only the commands its authoring flows live in have moved"}}, {"data": {"id": "ADR-0025-extends-ADR-0024", "source": "ADR-0025", "target": "ADR-0024", "label": "extends", "relation": "extends", "note": "changes which commands exist; the initial-as-short-name rule is unchanged and still holds"}}, {"data": {"id": "ADR-0025-extends-ADR-0014", "source": "ADR-0025", "target": "ADR-0014", "label": "extends", "relation": "extends", "note": "replaced the append save with a whole-rule-list rewrite, so per-rule comments no longer survive"}}, {"data": {"id": "ADR-0026-see_also-ADR-0006", "source": "ADR-0026", "target": "ADR-0006", "label": "see also", "relation": "see_also", "note": "elision shortens how a window is shown, never whether it is shown"}}, {"data": {"id": "ADR-0027-extends-ADR-0013", "source": "ADR-0027", "target": "ADR-0013", "label": "extends", "relation": "extends", "note": "a jq engine is a library behind one flag, not the CLI framework ADR-0013 refuses"}}, {"data": {"id": "ADR-0027-see_also-ADR-0021", "source": "ADR-0027", "target": "ADR-0021", "label": "see also", "relation": "see_also", "note": "-r is --region, so the raw-string switch keeps only its long name"}}, {"data": {"id": "ADR-0027-see_also-ADR-0002", "source": "ADR-0027", "target": "ADR-0002", "label": "see also", "relation": "see_also", "note": "gojq is pure Go, so the CGO-free single binary survives the dependency"}}, {"data": {"id": "ADR-0028-extends-ADR-0006", "source": "ADR-0028", "target": "ADR-0006", "label": "extends", "relation": "extends", "note": "keeps the guarantee and narrows its trigger to the runs the gap could actually have changed"}}, {"data": {"id": "ADR-0028-see_also-ADR-0008", "source": "ADR-0028", "target": "ADR-0008", "label": "see also", "relation": "see_also", "note": "both refuse to call a run successful on evidence the tool does not have"}}], "layout": {"name": "cose"}, "height": 620}</script>
<script id="record-data" type="application/json">{"ADR-0001": {"file": "0001-distribute-via-github-releases.md", "title": "Distribute via CI-built artifacts on the GitHub Releases page", "status": "accepted", "markdown": "# Distribute via CI-built artifacts on the GitHub Releases page\n\n\u003e **Lens**: Distribution machinery must match the audience that exists today. CI-built Releases artifacts serve a single user; tap or store machinery waits for a real external audience.\n\n## Relates to\n\n- Split to [ADR-0017](0017-terminal-app-is-the-tcc-client.md) (the TCC-client decision moved out on 2026-08-29)\n\n## Problem\n\n### Symptom\n\nscreenz must install on client laptops that have no App Store access and no Apple developer tooling, the same bar Rectangle clears via a cask.\n\n### Pain point\n\nA Homebrew tap needs a second repo and formula sha256 rewrites on every release, and notarisation needs an Apple account.\nAll of that serves an audience of zero for a single-user tool.\n\n## Decision\n\n### The lens\n\n- **Given**: a single-user tool whose binary cross-compiles CGO-free from any runner OS, and CLI downloads (`gh`, `curl`) that never set the quarantine xattr\n- **We prefer**: tag-triggered CI builds uploaded to the GitHub Releases page, over a Homebrew tap or committed per-arch binaries\n- **Because**: Releases already gives versioned, downloadable artifacts straight from CI with no extra machinery and no Apple account\n- **Unless**: the tool grows an external audience, at which point a prebuilt tap formula is the upgrade path\n\n### In practice\n\n- A `v*` tag runs `make check` then `make dist` on ubuntu-latest and uploads both darwin tarballs plus checksums.txt to the release.\n- The repo stays binary-free; installation is `gh release download` or `curl` per docs/install.md.\n\n## Consequences\n\n### Pros\n\n- Versioned artifacts with checksums, no second repo, no notarisation.\n\n### Cons\n\n- Browser downloads still hit Gatekeeper; the runbook documents the one-time xattr clear.\n"}, "ADR-0002": {"file": "0002-purego-bridge-cgo-free.md", "title": "Bridge to macOS through purego with CGO_ENABLED=0", "status": "accepted", "markdown": "# Bridge to macOS through purego with CGO_ENABLED=0\n\n\u003e **Lens**: Bind macOS primitives through purego and keep CGO off; prove each new symbol on real hardware before building anything on it.\n\n## Relates to\n\n- Tested by [ADR-0004](0004-two-test-tiers.md) (covers how the bridge is tested)\n\n## Problem\n\n### Symptom\n\nscreenz needs Accessibility, CoreGraphics and AppKit calls from Go, and purego has shipped ABI bugs for exactly the struct-by-value returns those APIs use.\n\n### Pain point\n\ncgo would require the Xcode command line tools on every build machine and client laptop, and would break the house CGO-free build convention.\n\n## Decision\n\n### The lens\n\n- **Given**: the spike proved struct-returning CGDisplayBounds, objc.Send[CGRect] exact on arm64, and AX enumerate plus set-frame with read back, all without a crash or ABI fault\n- **We prefer**: purego Dlopen + RegisterLibFunc bindings with objc.Send, over cgo\n- **Because**: it keeps CGO_ENABLED=0 and needs no compiler toolchain anywhere\n- **Unless**: a future symbol cannot be bound through purego; cgo then returns as the documented fallback for that symbol alone\n\n### In practice\n\n- All OS symbols live in internal/mac behind darwin build tags; missing symbols are recorded, never a panic.\n- Every new binding is verified against the real window server before use.\n\n## Consequences\n\n### Pros\n\n- CGO-free cross-compilation from any OS; no client toolchain.\n\n### Cons\n\n- The C ABI risk is owned here; each binding needs empirical proof.\n"}, "ADR-0003": {"file": "0003-fail-loudly-without-grant.md", "title": "Fail loudly when Accessibility is not granted", "status": "accepted", "markdown": "# Fail loudly when Accessibility is not granted\n\n\u003e **Lens**: An environment that cannot do the job fails with the responsible party named; it never reports an empty world as success.\n\n## Relates to\n\n- Extended by [ADR-0017](0017-terminal-app-is-the-tcc-client.md) (who the TCC client is)\n\n## Problem\n\n### Symptom\n\nWithout the grant, AX enumeration returns nothing and an unguarded run reports \"moved 0 windows\" with exit 0.\n\n### Pain point\n\nThat is a silent false success, and the fix is invisible: the grant belongs to the terminal app, not to screenz, so users looking for \"screenz\" in System Settings find nothing.\n\n## Decision\n\n### The lens\n\n- **Given**: TCC attributes a shell-launched tool to its terminal host app\n- **We prefer**: checking the grant first in every AX command and exiting 1 with the host app named, over proceeding and reporting whatever AX returns\n- **Because**: a run against an ungranted or unbindable machine can only produce misleading output\n- **Unless**: never; this one is unconditional\n\n### In practice\n\n- requireTrusted gates status and apply; missing dlopen symbols get their own named error, not the grant instruction.\n- doctor asks with the system prompt option and prints the exact remediation, including `tccutil reset`.\n\n## Consequences\n\n### Pros\n\n- No silent empty runs; the error names the fix.\n\n### Cons\n\n- Commands need the injected trust check even in pure tests.\n"}, "ADR-0004": {"file": "0004-two-test-tiers.md", "title": "Two test tiers; the integration tier fails, never skips", "status": "accepted", "markdown": "# Two test tiers; the integration tier fails, never skips\n\n\u003e **Lens**: Keep pure coverage universal and exercise the real OS seam on real hardware; a capability-gated skip is a green lie.\n\n## Relates to\n\n- Tests [ADR-0002](0002-purego-bridge-cgo-free.md) (tests the bridge)\n\n## Problem\n\n### Symptom\n\nThe only seam that matters (real AX behaviour) cannot run on hosted CI, yet the suite must stay runnable on any machine.\n\n### Pain point\n\nThe easy outs both lie: mocks prove the fake, and `t.Skip` when the grant is missing turns the suite green with zero coverage of the seam.\n\n## Decision\n\n### The lens\n\n- **Given**: house rules forbid mocks, hand-rolled fakes and capability-gated skips, and hosted macOS runners accept TCC rows yet still time out on AX calls\n- **We prefer**: two tiers, over one merged tier or hosted-CI AX testing\n- **Because**: `make check` stays pure and runs anywhere at 100% coverage, while `make itest` opens a real window, places it through the shipped path, and asserts the read back\n- **Unless**: hosted runners ever exercise AX reliably, which the evidence says they do not\n\n### In practice\n\n- check covers every package except cmd/screenz, internal/mac and internal/place; itest covers internal/mac, internal/place and internal/discover on real hardware.\n- cmd/screenz sits in neither tier. It only wires real implementations into Deps, so there is nothing there to assert that internal/cli does not already assert against injected values; the wiring is proved by the binary running at all.\n- An integration test that finds the grant missing fails with the grant instruction; it never skips.\n- Pure CLI tests feed real recorded machine values through injected Deps functions.\n\n## Consequences\n\n### Pros\n\n- check runs on the Linux release runner; the real seam still gets exercised before every commit.\n\n### Cons\n\n- itest requires a local trusted GUI session and briefly opens a TextEdit window.\n"}, "ADR-0005": {"file": "0005-group-windows-by-bundle-id.md", "title": "Group windows by bundle id, not PID", "status": "accepted", "markdown": "# Group windows by bundle id, not PID\n\n\u003e **Lens**: Group and address windows by product identity (the bundle id), never by process identity.\n\n## Problem\n\n### Symptom\n\nChromium and Electron apps run many processes; PID grouping splits one app's windows into several groups or merges helpers into the wrong one.\n\n### Pain point\n\nA rule that says \"all VS Code windows\" cannot be expressed reliably against PIDs, and profiles would encode unstable numbers.\n\n## Decision\n\n### The lens\n\n- **Given**: multi-process apps and profiles that must name applications durably\n- **We prefer**: NSRunningApplication.bundleIdentifier resolved from the window's PID as the group key, over the PID itself\n- **Because**: the bundle id is the stable product identity a profile can name, such as com.microsoft.VSCode\n- **Unless**: never; this one is unconditional\n\n### In practice\n\n- Discovery resolves every window's PID to a bundle id; the app name is a secondary display label.\n\n## Consequences\n\n### Pros\n\n- Rules and profiles address apps the way users think of them.\n\n### Cons\n\n- A rare bundle-less process groups under an empty key.\n"}, "ADR-0006": {"file": "0006-report-unactionable-windows.md", "title": "Report windows the tool cannot act on instead of hiding them", "status": "accepted", "markdown": "# Report windows the tool cannot act on instead of hiding them\n\n\u003e **Lens**: Never hide what the tool cannot act on; every un-actionable window carries a state and every incomplete sweep fails the run.\n\n## Relates to\n\n- See also [ADR-0008](0008-strict-tolerance-verification.md) (applies the same honesty to frames)\n- See also [ADR-0026](0026-status-elides-titles-and-takes-sections.md) (eliding a title shortens how a window is shown, never whether it is shown)\n- Extended by [ADR-0028](0028-incomplete-enumeration-blocks-only-what-it-could-change.md) (narrows when an incomplete enumeration refuses, without narrowing what gets reported)\n\n## Problem\n\n### Symptom\n\nMinimized, hidden and other-Space windows cannot be placed, and an app whose AX enumeration failed contributes no windows at all.\n\n### Pain point\n\nSilently dropping any of them makes a partial result look like a complete one, which is the exact failure this tool exists to prevent.\n\n## Decision\n\n### The lens\n\n- **Given**: Spaces have no public API (the offscreen skip is permanent) and AX enumeration can fail per app\n- **We prefer**: reporting a state (minimized, hidden, sheet, dialog, offscreen, unknown) and listing skips with reasons, over filtering un-actionable windows out\n- **Because**: the user must see what was not done and why, not infer it from absence\n- **Unless**: never; this one is unconditional\n\n### In practice\n\n- status shows every window with its state; a failed frame read is state unknown, never a zero-valued frame passed off as real.\n- apply lists matched-but-skipped windows with reasons and refuses to run when an application could not be enumerated.\n\n## Consequences\n\n### Pros\n\n- Partial results are visibly partial.\n\n### Cons\n\n- apply is stricter than fire-and-forget tools; a hung app blocks the run until addressed.\n"}, "ADR-0007": {"file": "0007-display-index-y-then-minx.md", "title": "Order display indexes by row, then left to right", "status": "accepted", "markdown": "# Order display indexes by row, then left to right\n\n\u003e **Lens**: The human-friendly display number follows the ordering users already know; stable identity always comes from UUID or name, never the index.\n\n## Problem\n\n### Symptom\n\nDisplays need a short human handle, but CG display ids are small unstable ints and identical panels can share a serial number.\n\n### Pain point\n\nWithout a declared ordering, \"display 2\" means different things after any layout change, and profiles written against numbers break silently.\n\n## Decision\n\n### The lens\n\n- **Given**: the user's muscle memory comes from Rectangle's ordering, and identical panels are only distinguishable by UUID or the suffixed localized name\n- **We prefer**: index numbering top-to-bottom by row then left-to-right, with a bare integer meaning index=N, over arbitrary or CG-id ordering\n- **Because**: it matches the ordering the user already knows, while UUID and name stay the durable keys\n- **Unless**: the reference convention changes; profiles that must survive layout changes already address panels by name or UUID instead\n\n### In practice\n\n- Purely numeric alias names are reserved so the integer shorthand stays unambiguous.\n- Zero-match display specs explain per term what each term would have matched.\n\n## Consequences\n\n### Pros\n\n- Quick one-digit tweaks for ad-hoc use; durable names for portable profiles.\n\n### Cons\n\n- Indexes shift when displays connect or move; that is documented, not hidden.\n"}, "ADR-0008": {"file": "0008-strict-tolerance-verification.md", "title": "Fail strictly on a mismatched frame, with a numeric tolerance", "status": "accepted", "markdown": "# Fail strictly on a mismatched frame, with a numeric tolerance\n\n\u003e **Lens**: Verification is never off. A rule may widen its tolerance numerically and deliberately;\n\u003e nothing may disable the check.\n\n## Relates to\n\n- See also [ADR-0010](0010-retry-three-times.md) (covers the retry before the verdict)\n\n## Problem\n\n### Symptom\n\nAX set-frame is a proposal: apps clamp to minimum sizes and aspect ratios silently, and the call still returns success.\n\n### Pain point\n\nA silently clamped window reported as placed is the canonical false success; without read back the tool cannot be trusted at all.\n\n## Decision\n\n### The lens\n\n- **Given**: apps clamp frames silently and AX rounds requested sizes to whole points\n- **We prefer**: comparing every edge of the read-back frame against a per-rule numeric tolerance (points, or percent of the target size per axis; default 0.5 pt), over always-strict or a boolean tolerant switch\n- **Because**: the default only absorbs AX rounding, while a known fixed-size app can widen its own rule without turning verification off for everything\n- **Unless**: never; the check can be widened but not disabled, so infinite and NaN tolerances are rejected at parse time\n\n### In practice\n\n- Any edge outside tolerance marks the window clamped and the run exits 1 with requested versus actual.\n- The stale error from a failed attempt is cleared so the verdict describes the final attempt only.\n\n## Consequences\n\n### Pros\n\n- Exit 0 is a real guarantee about where every window sits.\n\n### Cons\n\n- Minimum-sized windows need a deliberate per-rule tolerance to go green.\n"}, "ADR-0009": {"file": "0009-never-activate-during-apply.md", "title": "Never activate applications during a bulk apply", "status": "accepted", "markdown": "# Never activate applications during a bulk apply\n\n\u003e **Lens**: A bulk operation must not fight the user for focus; place frames through AX and leave the frontmost app alone.\n\n## Problem\n\n### Symptom\n\nRectangle activates an app after a cross-display move, which is fine for one focused window.\n\n### Pain point\n\nAcross a 16-window context switch, per-window activation would strobe focus, reorder the window stack, and interrupt whatever the user is doing.\n\n## Decision\n\n### The lens\n\n- **Given**: applies touch many windows across many apps in one run\n- **We prefer**: setting frames through AX without any activation, over Rectangle's activate-after-move\n- **Because**: the frontmost app must be unchanged after the run\n- **Unless**: a single-window interactive mode ever ships, where activation may be the point\n\n### In practice\n\n- place.Place performs the set-size, set-position, set-size recipe with no NSRunningApplication activation anywhere.\n\n## Consequences\n\n### Pros\n\n- Applies are silent; focus never moves.\n\n### Cons\n\n- None observed; cross-display placement works without activation.\n"}, "ADR-0010": {"file": "0010-retry-three-times.md", "title": "Retry a mismatched frame three times with a 25 ms pause", "status": "accepted", "markdown": "# Retry a mismatched frame three times with a 25 ms pause\n\n\u003e **Lens**: Give macOS the settled three attempts before judging a frame; retry immediately, then once more after 25 ms.\n\n## Relates to\n\n- See also [ADR-0008](0008-strict-tolerance-verification.md) (feeds the verdict)\n\n## Problem\n\n### Symptom\n\nA window moved to another display keeps its old size on the first attempt.\n\n### Pain point\n\nmacOS clamps the size to the source display until the position lands, so a single set produces an honest-but-avoidable clamped verdict.\n\n## Decision\n\n### The lens\n\n- **Given**: the size clamp resolves once the position has landed, usually within milliseconds\n- **We prefer**: re-applying immediately on mismatch and once more after 25 ms, over a single attempt or an open-ended retry loop\n- **Because**: three attempts is the proven prior art and bounds the worst case per window\n- **Unless**: macOS changes the clamp behaviour this recipe compensates for\n\n### In practice\n\n- Each attempt runs set size, set position, set size, then reads back; the loop exits early once within tolerance.\n\n## Consequences\n\n### Pros\n\n- Cross-display moves converge without user-visible flicker.\n\n### Cons\n\n- A genuinely refusing window costs three attempts before its clamped verdict.\n"}, "ADR-0011": {"file": "0011-match-opens-a-rule.md", "title": "Each --match opens a rule; sibling flags bind to it", "status": "accepted", "markdown": "# Each --match opens a rule; sibling flags bind to it\n\n\u003e **Lens**: One quoting layer, and keys that match across CLI and YAML unless the file reads better for differing; the CLI grammar is the saved-profile grammar.\n\n## Relates to\n\n- Depended on by [ADR-0014](0014-goccy-yaml-comments.md) (relies on this for lossless profile saves)\n- Extended by [ADR-0020](0020-omitted-region-means-maximize.md) (the region half of the completeness clause below is retired there; display stays mandatory)\n- Extended by [ADR-0021](0021-one-letter-aliases-for-rule-flags.md) (adds a one-letter alias per rule flag; the long name stays the canonical and the YAML key)\n\n## Problem\n\n### Symptom\n\nStdlib flag has no native repeated groups, but one invocation must carry many selector, display, region rules.\n\n### Pain point\n\nA nested rule string would need its own parser and two or three quoting layers, and profiles would store opaque strings.\n\n## Decision\n\n### The lens\n\n- **Given**: profile save must serialise flags losslessly, and the flag package documents that Value.Set is called in command-line order\n- **We prefer**: repeated --match opening a rule with sibling flags binding to the most recent one, over --rule strings or positional groups\n- **Because**: ordering makes the binding deterministic, and the keys map one-to-one into YAML but for the documented each inversion\n- **Unless**: a future selector cannot be expressed in a single flag value\n\n### In practice\n\n- A sibling flag before any --match is a usage error (exit 2); every rule requires a display and a region after parsing.\n- The keys match one for one, with one deliberate exception. The --first flag is stored as each, inverted, because a profile reads better stating that a rule applies to every match than stating that it does not apply to only the first.\n\n## Consequences\n\n### Pros\n\n- Lossless save; one grammar to learn.\n\n### Cons\n\n- Long command lines for big contexts, which profiles exist to absorb.\n"}, "ADR-0012": {"file": "0012-last-slash-regex.md", "title": "Spell regexes as /pattern/, terminated at the last slash", "status": "accepted", "markdown": "# Spell regexes as /pattern/, terminated at the last slash\n\n\u003e **Lens**: The same regex literal must work unchanged in CLI and YAML, and slashes inside window titles need no escaping; any remaining ambiguity fails loudly, never silently.\n\n## Relates to\n\n- See also [ADR-0011](0011-match-opens-a-rule.md) (shares the term grammar)\n\n## Problem\n\n### Symptom\n\nWindow titles contain slashes (paths, URLs), and regex values need a delimiter that survives both shell quoting and YAML scalars.\n\n### Pain point\n\nA conventionally-terminated delimiter would force escaping inside titles, and a second spelling for YAML would break lossless saves.\n\n## Decision\n\n### The lens\n\n- **Given**: titles contain slashes and the value must round-trip between CLI and YAML unchanged\n- **We prefer**: /pattern/ terminated at the last slash outside quoted regions, with an optional trailing i, over tilde or prefix spellings\n- **Because**: last-slash termination makes interior slashes free, and Go's RE2 rejects look-arounds as clean usage errors\n- **Unless**: a real pattern proves ambiguous under last-slash parsing; the swallowed-term guard now turns that case into a loud usage error rather than a silent mis-match\n\n### In practice\n\n- The terminator scan ignores quoted regions, and a pattern that captures a following key=value term errors with guidance.\n\n## Consequences\n\n### Pros\n\n- Natural title patterns; one spelling everywhere.\n\n### Cons\n\n- Two regex terms in one list must be reordered or reduced to one.\n"}, "ADR-0013": {"file": "0013-stdlib-flag-cli.md", "title": "Use stdlib flag with a hand-rolled subcommand table", "status": "accepted", "markdown": "# Use stdlib flag with a hand-rolled subcommand table\n\n\u003e **Lens**: Stdlib parsing with a hand-rolled dispatch table; no CLI framework enters this codebase.\n\n## Relates to\n\n- See also [ADR-0021](0021-one-letter-aliases-for-rule-flags.md) (its alias mechanism and the absence of flag clustering both follow from stdlib flag)\n- Extended by [ADR-0024](0024-commands-answer-to-their-initial.md) (gives each command in the dispatch table a second case label, its initial)\n- Extended by [ADR-0027](0027-embed-jq-behind-a-jq-flag.md) (settles where the no-framework rule stops - a library behind one flag is not a framework)\n\n## Problem\n\n### Symptom\n\nThe CLI needs subcommands, repeated flags and exit-code discipline, which frameworks advertise.\n\n### Pain point\n\nA framework buys convenience with a dependency, its own conventions, and drift from the house pattern used across every other tool.\n\n## Decision\n\n### The lens\n\n- **Given**: the house rule mandates stdlib parsing and the tool's needs are modest\n- **We prefer**: stdlib flag plus a switch on the first positional, over cobra or urfave/cli\n- **Because**: the pattern covers everything needed and stays dependency-free\n- **Unless**: never; this one is unconditional\n\n### In practice\n\n- Exit codes: 0 success, 1 runtime error, 2 usage error; help to stdout on request, errors and usage to stderr.\n- Read-only verbs are named status.\n\n## Consequences\n\n### Pros\n\n- No framework dependency; predictable behaviour.\n\n### Cons\n\n- Repeated FlagSet boilerplate per command, kept small by shared helpers.\n"}, "ADR-0014": {"file": "0014-goccy-yaml-comments.md", "title": "Use goccy/go-yaml so profile comments survive saves", "status": "accepted", "markdown": "# Use goccy/go-yaml so profile comments survive saves\n\n\u003e **Lens**: A hand-commented file is user data; every write must preserve the comments and survive interruption.\n\n## Relates to\n\n- Depends on [ADR-0011](0011-match-opens-a-rule.md) (serialises the grammar)\n- Extended by [ADR-0025](0025-three-verbs-profiles-named-by-flag.md) (turned the save from an append into a whole-rule-list replace, which narrowed what survives)\n\n## Problem\n\n### Symptom\n\nProfiles are commented specs, and yaml.v3 drops comments on struct marshal while being archived upstream.\n\n### Pain point\n\nA save that strips the user's comments, or a crash that truncates the file, destroys hand-authored content that cannot be regenerated.\n\n## Decision\n\n### The lens\n\n- **Given**: comments must round-trip and the library landscape offers goccy's comment map as the maintained option\n- **We prefer**: goccy/go-yaml with Strict decoding and CommentToMap/WithComment, over yaml.v3 or a release-candidate v4\n- **Because**: unknown keys error instead of vanishing, and comments survive the round trip\n- **Unless**: a maintained yaml v4 stabilises with equivalent comment support, which would prompt a re-evaluation\n\n### In practice\n\n- A save rewrites the whole rules list in place, block style only, written via temp-file rename (ADR-0025).\n- Comment-map keys are positional, so a comment on a rule that no longer exists would reattach to whatever now sits at that index. Every per-rule comment is dropped on a save; every comment outside the rules list survives.\n- The comment on the rules key itself survives, because that key carries no index and documents the section rather than any one rule.\n- Blank lines do not survive a save and flow-style comments are lost; the template avoids both.\n\n## Consequences\n\n### Pros\n\n- The header, the displays alias map and their comments survive every save, which is where hand-authored context actually lives.\n\n### Cons\n\n- One third-party dependency, pinned and exercised by round-trip tests.\n- A comment written against an individual rule is lost the next time that profile is saved, and only the positional-key hazard makes that defensible.\n"}, "ADR-0015": {"file": "0015-profile-dir-resolution.md", "title": "Resolve the profile directory dotfiles-first", "status": "accepted", "markdown": "# Resolve the profile directory dotfiles-first\n\n\u003e **Lens**: Config paths are dotfiles-first: an explicit env override, then XDG, then ~/.config;\n\u003e never a path with a space.\n\n## Problem\n\n### Symptom\n\nGo's os.UserConfigDir on darwin ignores XDG_CONFIG_HOME and returns ~/Library/Application Support, a path containing a space.\n\n### Pain point\n\nThat path is awkward to version in a dotfiles repo and unoverridable in tests and client-site setups.\n\n## Decision\n\n### The lens\n\n- **Given**: the user syncs tool config through dotfiles and needs a cheap override\n- **We prefer**: $SCREENZ_HOME, then $XDG_CONFIG_HOME/screenz, then ~/.config/screenz, over os.UserConfigDir\n- **Because**: the XDG path is syncable and space-free, and the env override keeps a wrong default cheap everywhere\n- **Unless**: a GUI or daemon mode ships, where Application Support conventions would apply\n\n### In practice\n\n- Profiles live at profiles/\u003cname\u003e.yaml under the resolved directory; doctor prints the resolution.\n\n## Consequences\n\n### Pros\n\n- Dotfiles-friendly, trivially overridable in tests.\n\n### Cons\n\n- Diverges from the platform's default app-config location, deliberately.\n"}, "ADR-0016": {"file": "0016-no-capture-from-current.md", "title": "Profiles are authored from flags or the template, not captured", "status": "accepted", "markdown": "# Profiles are authored from flags or the template, not captured\n\n\u003e **Lens**: Automate the repeated task, not the rare one; capture features earn their place only when authoring cost dominates.\n\n## Relates to\n\n- See also [ADR-0025](0025-three-verbs-profiles-named-by-flag.md) (the no-capture rule below stands; the commands its authoring flows live in moved there)\n\n## Problem\n\n### Symptom\n\nA capture-from-current command looks convenient: snapshot today's layout into a profile.\n\n### Pain point\n\nCaptured selectors over-match (the title regex that splits browser profiles cannot be inferred), and captured regions describe today's frames rather than intent, so every capture needs hand-editing anyway.\n\n## Decision\n\n### The lens\n\n- **Given**: profiles are authored a handful of times ever, while the context switch repeats daily\n- **We prefer**: profile init (a commented template) and profile save from rule flags, over a --from-current capture\n- **Because**: a capture mapper is surface without payoff and would force a snap-or-fail policy that contradicts strict verification\n- **Unless**: the number of contexts or machines grows enough that authoring cost dominates\n\n### In practice\n\n- Authoring flows are init, hand-edit, and save; there is no capture path to maintain.\n\n## Consequences\n\n### Pros\n\n- Less surface; profiles encode intent, not accidents of today's layout.\n\n### Cons\n\n- New contexts take a few minutes of hand-authoring.\n"}, "ADR-0017": {"file": "0017-terminal-app-is-the-tcc-client.md", "title": "The terminal app is the TCC client; no daemon mode", "status": "accepted", "markdown": "# The terminal app is the TCC client; no daemon mode\n\n\u003e **Lens**: Keep screenz shell-launched so the Accessibility grant belongs to the terminal app and survives every rebuild; a self-responsible daemon needs a Developer ID certificate first.\n\n## Relates to\n\n- Split from [ADR-0001](0001-distribute-via-github-releases.md)\n- Extends [ADR-0003](0003-fail-loudly-without-grant.md)\n\n## Problem\n\n### Symptom\n\nAn ad-hoc signed binary that owns its own TCC grant loses it on every rebuild, because TCC keys it on the binary's CDHash.\n\n### Pain point\n\nUsers would re-grant Accessibility after every update, and would not know why, since System Settings shows the app list, not the hash bookkeeping.\n\n## Decision\n\n### The lens\n\n- **Given**: a shell-launched tool inherits its terminal host app's grant, so the Go linker's ad-hoc signature never matters\n- **We prefer**: documenting and testing screenz only as a shell-launched tool, over a LaunchAgent or daemon mode\n- **Because**: the grant then keys on the terminal app and survives rebuilds and updates\n- **Unless**: daemon mode is ever justified and a Developer ID certificate is acquired to give the binary a stable identity\n\n### In practice\n\n- doctor and every error name the responsible terminal app, never the binary.\n- The install runbook grants Accessibility per terminal app and documents `tccutil reset`.\n\n## Consequences\n\n### Pros\n\n- Grants survive updates; no signing infrastructure.\n\n### Cons\n\n- No background or hotkey mode; every action is a shell invocation.\n"}, "ADR-0018": {"file": "0018-demo-mode-replays-a-recorded-world.md", "title": "Demo mode replays a recorded world and simulates placement", "status": "accepted", "markdown": "# Demo mode replays a recorded world and simulates placement\n\n\u003e **Lens**: Fabricated output is a documentation prop, never a product path: gate it on an explicit env var, wire it only in cmd, disclose it in doctor, and keep it out of every test.\n\n## Relates to\n\n- Scoped exception to [ADR-0008](0008-strict-tolerance-verification.md) (demo mode simulates read-back; the rule stands everywhere else)\n- Depends on [ADR-0004](0004-two-test-tiers.md) (replay rides the injected Deps seams)\n\n## Problem\n\n### Symptom\n\nCurating demonstration text for the README requires the demoed hardware: undocked, `apply` aborts at display resolution, and the verified table cannot exist without real windows landing.\n\n### Pain point\n\nDemo GIFs could only be re-rendered when docked, so documentation freshness was hostage to physical setup.\n\n## Decision\n\n### The lens\n\n- **Given**: the CLI is a pure pipeline over injected `Deps`, and `status --json` already serialises a complete world\n- **We prefer**: `SCREENZ_DEMO=\u003cworld.json\u003e` replaying a recorded world through the real pipeline, with placement simulated as read-back-equals-target\n- **Because**: every demo line except the ACTUAL column is then genuinely computed, and demos render anywhere\n- **Unless**: the fabricated output starts being mistaken for verification evidence; then demo output must carry an inline marker, not just the doctor disclosure\n\n### In practice\n\n- `internal/demo` owns `Load` (the `status --json` schema) and the simulated `Place`; `cmd/screenz` wires them only when `SCREENZ_DEMO` is set.\n- Doctor always prints `demo mode: replaying \u003cpath\u003e; placement simulated` (and `demo_world` in JSON) when the variable is set.\n- The read-back rule of ADR-0008 stands everywhere else: tests never wire demo mode, and `docs/evidence/` transcripts must never be captured under it.\n\n## Consequences\n\n### Pros\n\n- Demos regenerate on any machine, including CI without displays; demo worlds are curated fixtures with clean titles.\n\n### Cons\n\n- An apply table in a demo GIF is staged output; the honesty of the README now rests on this ADR's discipline rather than on the run itself.\n"}, "ADR-0019": {"file": "0019-demos-are-vhs-tapes.md", "title": "Animated demos are VHS tapes rendered through demo mode", "status": "accepted", "markdown": "# Animated demos are VHS tapes rendered through demo mode\n\n\u003e **Lens**: A demo is documentation, and documentation drifts: it must be regenerable by script from checked-in sources.\n\u003e A recording that needs a human at the right desk is a screenshot with extra steps.\n\n## Relates to\n\n- Depends on [ADR-0018](0018-demo-mode-replays-a-recorded-world.md) (renders through demo mode)\n\n## Problem\n\n### Symptom\n\nThe README needed animated demos, and two toolchains could produce them: VHS (scripted tapes) and asciinema + agg (recorded casts).\n\n### Pain point\n\nRecorded casts are point-in-time captures: re-recording needs the same machine state, and agg cannot draw window chrome.\nThe choice had to be settled once so demos would not fork by tool.\n\n## Decision\n\n### The lens\n\n- **Given**: demos must stay true to a moving CLI, and the repo already treats docs drift as a continuous process\n- **We prefer**: VHS tapes checked in beside their GIFs under docs/demos, rendered through `SCREENZ_DEMO`\n- **Because**: the tape is the demo (deterministic re-render, CI-capable via vhs-action), and `Set WindowBar` draws the title bar agg cannot\n- **Unless**: demos need terminal replay or a hosted player; then an asciinema cast can be added alongside, not instead\n\n### In practice\n\n- Three tapes cover the narrative: trust + status, verified apply, profile round-trip.\n- Tapes export `SCREENZ_DEMO=demo-world.json`, so rendering needs no displays and no window moves.\n\n## Consequences\n\n### Pros\n\n- Demos regenerate with one command on any machine; demo changes are reviewable text diffs (tape + world file).\n\n### Cons\n\n- GIF binaries live in git and are re-committed on every re-render; VHS sizes in pixels, so column budgets need width arithmetic per tape.\n"}, "ADR-0020": {"file": "0020-omitted-region-means-maximize.md", "title": "An omitted region means maximize", "status": "accepted", "markdown": "# An omitted region means maximize\n\n\u003e **Lens**: A rule must always say which display; it need not say how big.\n\u003e Omitting --region means maximize, so the commonest rule is also the shortest one to type.\n\n## Relates to\n\n- Extends [ADR-0011](0011-match-opens-a-rule.md) (narrows that record's completeness clause \u2014 display stays mandatory, region no longer is)\n- See also [ADR-0022](0022-region-spellings-canonicalise-on-parse.md) (the default is stored in the catalogue spelling, as an explicitly typed region is)\n\n## Problem\n\n### Symptom\n\nEvery rule had to spell --region even when the intent was the whole display, so a three-rule context switch failed on the first rule with nothing moved.\n\n### Pain point\n\nThe most common region was also the most typed, and the error arrived after the whole command line had been written rather than while writing it.\n\n## Decision\n\n### The lens\n\n- **Given**: a rule already names its display, and maximize is both the commonest region and the only one that needs no further parameters\n- **We prefer**: defaulting an omitted region to maximize, over keeping region mandatory or inventing a keep-current-size region\n- **Because**: which display a window belongs on cannot be guessed, but how much of that display it should take can be, and a default frame keeps read-back verification exact\n- **Unless**: a future region catalogue has no single obvious whole-frame member\n\n### In practice\n\n- The default is a constructed layout.DefaultRegion(), never the zero Region, which spans nothing.\n- It is seeded when --match opens the rule, alongside the order and tolerance defaults, so a later --region simply overwrites it.\n- The profile YAML grammar defaults identically; the save path still writes the key back explicitly, so a round-tripped profile is never ambiguous.\n\n## Consequences\n\n### Pros\n\n- The whole-display context switch is one flag per rule shorter, and rules read as selector then destination.\n- Verification is untouched \u2014 a defaulted region is a concrete frame, checked against read-back like any other.\n\n### Cons\n\n- A forgotten --region now maximizes instead of failing, so a typo in a region name is the only remaining loud error; --dry-run is the way to see the frames before they move.\n"}, "ADR-0021": {"file": "0021-one-letter-aliases-for-rule-flags.md", "title": "One-letter aliases for the rule grammar; destructive flags stay long", "status": "accepted", "markdown": "# One-letter aliases for the rule grammar; destructive flags stay long\n\n\u003e **Lens**: Flags typed once per rule earn a one-letter alias; flags that overwrite a file or replace the binary are typed in full.\n\u003e The long name stays canonical everywhere a flag is named back to the user or written to disk.\n\n## Relates to\n\n- Extends [ADR-0011](0011-match-opens-a-rule.md) (adds a second spelling of each rule flag without changing what a rule is)\n- See also [ADR-0013](0013-stdlib-flag-cli.md) (stdlib flag is why aliases are a second registration and why -mdr grouping does not exist)\n- See also [ADR-0024](0024-commands-answer-to-their-initial.md) (the same one-letter treatment, applied to the command word rather than to its flags)\n\n## Problem\n\n### Symptom\n\nEvery rule in an apply line spells out --match, --display and --region, so a three-rule context switch runs past the width of a terminal before it says anything.\n\n### Pain point\n\nThe flags typed most often were the longest, which pushed real use toward profiles even for one-off placements that profiles are not meant to absorb.\n\n## Decision\n\n### The lens\n\n- **Given**: stdlib flag treats one and two dashes alike and lets one Value carry several names, but has no clustering and no separate short-flag namespace\n- **We prefer**: a curated one-letter alias per rule flag (-m -d -r -g -t -f -o) plus -j and -n, over aliasing every flag or none\n- **Because**: the alias set is small enough to hold in the head, and leaving --force and --check long makes the irreversible commands read deliberately\n- **Unless**: a new rule flag has no free letter, in which case it ships long-only rather than displacing an existing letter\n\n### In practice\n\n- -f is --first, not --force; profile save registers both, and only one of them may own the letter.\n- Errors, help text and profile YAML keys always name the long form, so a message never teaches a spelling that is not the canonical one.\n- -h needs no registration; stdlib flag returns ErrHelp for an undefined -h and every subcommand already maps that to its help text.\n- Clustering (-mdr) does not exist under stdlib flag and is not wanted here \u2014 every rule flag except --first takes a value, so a cluster could hold at most one of them and would only obscure which value bound to which flag.\n\n## Consequences\n\n### Pros\n\n- A whole context switch fits on one line, which is what makes an inline apply competitive with a profile.\n- Aliases are the same flag object, so a short and a long spelling can never disagree about a value.\n\n### Cons\n\n- Every future flag now carries a letter question, and the letters are nearly exhausted.\n- Two spellings means a shell history or a script may read in either, so the alias table has to be known to read someone else's command line.\n"}, "ADR-0022": {"file": "0022-region-spellings-canonicalise-on-parse.md", "title": "Accept en-GB region spellings, canonicalise them on parse", "status": "accepted", "markdown": "# Accept en-GB region spellings, canonicalise them on parse\n\n\u003e **Lens**: A vocabulary word with a second correct spelling accepts both at the door and stores one.\n\u003e Aliases live in the parser, never in the catalogue, so nothing downstream learns there are two names for one thing.\n\n## Relates to\n\n- See also [ADR-0020](0020-omitted-region-means-maximize.md) (the defaulted region is stored in canonical spelling like any other)\n- Extended by [ADR-0023](0023-shorthand-codes-for-region-names.md) (shorthand codes reuse this canonicalise-at-the-door rule for a second class of alias)\n\n## Problem\n\n### Symptom\n\nThe catalogue spells maximize and center-third, so maximise and centre-third are rejected as unknown regions by a user who spelled them correctly for their own dialect.\n\n### Pain point\n\nAdding the variants to the catalogue itself would double the vocabulary \u2014 two names for one region in help text, in error listings and in saved profiles, with no way to tell which is the real one.\n\n## Decision\n\n### The lens\n\n- **Given**: the region catalogue is a closed set of words, two of which have an en-GB/en-AU variant, and every region already round-trips through String into profile YAML\n- **We prefer**: a parser-level alias table that rewrites the input before lookup, over adding variant keys to the catalogue or normalising every s/z in sight\n- **Because**: canonicalising at the single door keeps one spelling in help, in errors and on disk, while costing the user nothing at the keyboard\n- **Unless**: a variant is not a spelling of the same word but a different region, which the catalogue must then name in full\n\n### In practice\n\n- maximise resolves to maximize and centre-third to center-third; those are the only two catalogue words with a variant.\n- The alias is not preserved \u2014 a profile saved from --region maximise stores region maximize, which is semantically lossless but not byte-for-byte.\n- Unknown input keeps its original text in the error, since canonicalisation only happens on a hit.\n\n## Consequences\n\n### Pros\n\n- The tool reads as correctly spelled to both dialects without either spelling becoming a second official name.\n- One door \u2014 profile YAML, inline flags and the demo transcripts all validate through the same ParseRegion.\n\n### Cons\n\n- A user who types maximise sees maximize come back in their saved profile, which is a small surprise the help text has to carry.\n- Every future catalogue word now needs the variant question asked at the time it is added.\n"}, "ADR-0023": {"file": "0023-shorthand-codes-for-region-names.md", "title": "Every region name has a shorthand code; thirds use digits", "status": "accepted", "markdown": "# Every region name has a shorthand code; thirds use digits\n\n\u003e **Lens**: A code is a second way to type a name, never a second name.\n\u003e Codes resolve at the parser door like any other alias, and the catalogue name is what help, errors and profiles say.\n\n## Relates to\n\n- Extends [ADR-0022](0022-region-spellings-canonicalise-on-parse.md) (reuses that record's canonicalise-at-the-door rule for a second class of alias)\n\n## Problem\n\n### Symptom\n\nA rule spells out left-half or first-two-thirds in full, which is the longest token on a line that already carries a selector and a display.\n\n### Pain point\n\nA purely mechanical scheme of word initials puts lt (last-third) one transposition from tl (top-left) and ftt one character from ltt, so a slip parses cleanly and places a window in the wrong part of the screen.\n\n## Decision\n\n### The lens\n\n- **Given**: fourteen named regions in three families \u2014 one whole-frame, halves and corners that split on position, thirds that split on ordinal\n- **We prefer**: letters for the halves and corners with a digit suffix for the thirds (f3, c3, l3, f23, l23), over the initial-of-each-word scheme that would give ft, ct, lt, ftt, ltt\n- **Because**: the digit puts the thirds in a visually separate family, so no code is a transposition or a one-character slip away from a different region\n- **Unless**: a region joins the catalogue whose code would collide, which the record must then resolve before the region ships\n\n### In practice\n\n- Every named region has exactly one code, enforced by a test that walks the catalogue and the code table in both directions.\n- max is the one code that is not built from initials; maximize is one word and m alone reads as nothing in particular.\n- Codes are dialect-free \u2014 c3 is the centre third however it is spelled \u2014 so they need no entry in the spelling alias table.\n- A code never reaches disk; --region l3 saves as region last-third.\n\n## Consequences\n\n### Pros\n\n- The common rules shorten to -r lh and -r max, which is what makes a three-rule inline apply fit on one line.\n- A mistyped code is an unknown region rather than a different region, because no code is one slip from another.\n\n### Cons\n\n- Twenty-eight accepted spellings now reach one catalogue of fourteen, so the help text has to carry a table it did not need before.\n- max breaks the scheme's own shape, which is the price of not calling the commonest region m.\n"}, "ADR-0024": {"file": "0024-commands-answer-to-their-initial.md", "title": "Every command answers to its initial", "status": "accepted", "markdown": "# Every command answers to its initial\n\n\u003e **Lens**: A command's short name is its first letter \u2014 not a chosen abbreviation, so there is nothing to remember and nothing to look up.\n\u003e That makes the initial part of naming a command: a new command with a taken letter is a naming problem, not an alias problem.\n\n## Relates to\n\n- Extends [ADR-0013](0013-stdlib-flag-cli.md) (adds a second case label per command to the hand-rolled dispatch table, with no parser change)\n- See also [ADR-0021](0021-one-letter-aliases-for-rule-flags.md) (the same one-letter treatment, applied to the command word rather than to its flags)\n- Extended by [ADR-0025](0025-three-verbs-profiles-named-by-flag.md) (changes which commands exist; the initial-as-short-name rule here is unchanged)\n\n## Problem\n\n### Symptom\n\nThe rule flags shortened to -m, -d and -r while the command in front of them stayed a whole word, so the shortest useful invocation still opened with apply.\n\n### Pain point\n\nAn abbreviation table for commands would be one more thing to memorise, and a prefix matcher would make screenz s ambiguous the day a second s command lands, silently rebinding a command someone had already learned.\n\n## Decision\n\n### The lens\n\n- **Given**: six commands with six distinct initials, dispatched by a switch on the first positional\n- **We prefer**: the initial as a fixed second case label per command, over prefix matching or a chosen-abbreviation table\n- **Because**: a fixed label can never become ambiguous later, and prefix matching would change what an existing short form means the moment a sibling command is added\n- **Unless**: a command that must exist has no free initial, which is a reason to rename the command rather than to skip its letter\n\n### In practice\n\n- a apply, d doctor, s status, p profile, u update, v version, h help; --version and -h keep working as before.\n- The full name is what usage text, error messages and the ADRs say; the letter is only ever an input.\n- No prefix matching \u2014 st is not status, and an unknown command is still an unknown command.\n\n## Consequences\n\n### Pros\n\n- The whole invocation shortens at once, so screenz a -m app=Code -d 2 is the short form end to end.\n- Adding a command now asks the letter question at naming time, when renaming is still cheap.\n\n### Cons\n\n- Seven of twenty-six letters are spent, and the obvious next commands (save, snapshot, swap) all want s.\n- A letter is silent about what it does, so a command line in someone else's history reads worse than the long form.\n"}, "ADR-0025": {"file": "0025-three-verbs-profiles-named-by-flag.md", "title": "Three verbs, and a profile is named by flag", "status": "accepted", "markdown": "# Three verbs, and a profile is named by flag\n\n\u003e **Lens**: A subcommand names an action, never a noun to manage: apply, status, list, init.\n\u003e Which profile an action concerns is a flag, so the same name is read the same way everywhere and a bare word is never a silent guess.\n\n## Relates to\n\n- See also [ADR-0016](0016-no-capture-from-current.md) (its no-capture rule stands unchanged; only the commands its authoring flows live in have moved)\n- Extends [ADR-0024](0024-commands-answer-to-their-initial.md) (changes which commands exist; the initial-as-short-name rule is unchanged and still holds)\n- Extends [ADR-0014](0014-goccy-yaml-comments.md) (replaced the append save with a whole-rule-list rewrite, so per-rule comments no longer survive)\n\n## Problem\n\n### Symptom\n\nProfile work was split across `profile status`, `profile init` and `profile save`, while applying one was a bare positional on apply \u2014 four spellings of the same noun across two nesting levels.\n\n### Pain point\n\nA nested noun-command has to be learned as a place before anything can be done in it, and a positional name meant `apply office` and `apply --match ...` were different grammars that a typo could slide between.\n\n## Decision\n\n### The lens\n\n- **Given**: every profile operation is really an action on the rule set \u2014 run it, save it, start one, see which ones fit\n- **We prefer**: folding them into apply, init and list with the profile named by --profile or --save-profile, over a profile noun-command with subcommands\n- **Because**: a flag-named profile reads identically in every command, and dropping the positional means a bare word is always an error rather than sometimes a profile\n- **Unless**: an operation appears that is about the profile file itself rather than its rules, which would earn its own verb\n\n### In practice\n\n- apply --profile NAME runs it; apply FLAGS --save-profile NAME keeps what was just typed; init --profile NAME starts one from the template; list shows which fit.\n- --save-profile replaces the profile's rules in place and leaves the rest of the file alone, so comments and the displays map survive (ADR-0014).\n- What is saved is the unresolved rule set \u2014 an alias stays an alias, because saving the resolved form would bake today's display indexes into the file and destroy the indirection the profile exists for.\n- The save runs before placement, so a run that fails to place still keeps the rules that were asked for.\n- A bare word where a profile name used to go \u2014 apply office, init office \u2014 is a usage error naming the flag to use; neither guesses.\n- list rolls one verdict per profile, with the reasons behind --verbose; a profile declaring no aliases fits trivially.\n\n## Consequences\n\n### Pros\n\n- Four commands where there were six, and one grammar for naming a profile.\n- A profile is now savable straight from the invocation that proved it, which was two commands and a retyped rule set before.\n\n### Cons\n\n- A breaking change one release after the flags were settled; every v0.4.0 invocation using `profile` or a positional name must be retyped.\n- --save-profile replaces rather than appends, so building a profile up rule by rule now means passing the whole set each time.\n"}, "ADR-0026": {"file": "0026-status-elides-titles-and-takes-sections.md", "title": "status elides titles and takes a section", "status": "accepted", "markdown": "# status elides titles and takes a section\n\n\u003e **Lens**: A human-facing table is allowed to shorten a field to stay readable; a machine-facing one never is.\n\u003e Elision is a display concern, so it lives in the renderer and is reversible with a flag \u2014 the underlying value is never truncated.\n\n## Relates to\n\n- See also [ADR-0006](0006-report-unactionable-windows.md) (elision shortens how a window is shown, never whether it is shown)\n\n## Problem\n\n### Symptom\n\nOne long window title wraps the status table, and a wrapped table loses the column alignment that makes it scannable \u2014 the display section below it becomes unreadable too.\n\n### Pain point\n\nBoth halves of status are always printed, so reading about displays meant scrolling past every window, and the fix for either could not be a flag that hid information.\n\n## Decision\n\n### The lens\n\n- **Given**: status serves two audiences \u2014 a human scanning a terminal, and a script reading --json\n- **We prefer**: eliding the title to 8 runes either side of an ellipsis for the table only, with --verbose to restore it, over wrapping, over a width-detecting layout, or over dropping the column\n- **Because**: a fixed elision is deterministic in a pipe and a recording, and confining it to the table keeps --json a faithful contract\n- **Unless**: a field other than the title starts overflowing, which is a layout problem rather than a per-field one\n\n### In practice\n\n- --json is never elided, with or without --verbose; a machine reading it gets the real title.\n- The cut is on rune boundaries, since titles carry em dashes and non-Latin scripts.\n- A title no longer than the elided form is left alone \u2014 replacing 19 characters with 19 characters loses the ends and gains nothing.\n- The apps and displays sections narrow the report, and narrow the JSON the same way, so a consumer asking for one section is not handed the other's rows. The other key stays present with a null value; the schema is one shape whichever section was asked for.\n- An enumeration failure is not one of those rows. It states how much of the world was readable, so it survives every narrowing and appears under every section.\n- An application that failed to enumerate is still reported even when only displays were asked for (ADR2.2).\n- A bare word that is not a section is a usage error, never ignored \u2014 ignoring it would print the full report and look like the section was honoured.\n\n## Consequences\n\n### Pros\n\n- The table survives a real window set, which is the only set it is ever used on.\n- Reading about displays is one word, not a scroll.\n\n### Cons\n\n- Two titles that differ only in their middle now look identical in the table, and --verbose is the only way to tell them apart.\n- Section is a positional on a CLI that otherwise names things with flags, which is a wrinkle justified only by how often it is typed.\n"}, "ADR-0027": {"file": "0027-embed-jq-behind-a-jq-flag.md", "title": "Embed a jq engine behind --jq rather than shell out", "status": "accepted", "markdown": "# Embed a jq engine behind --jq rather than shell out\n\n\u003e **Lens**: A convenience that only works when a second tool is installed is not a feature, it is a shorter way to type a pipe.\n\u003e When the CLI absorbs another tool's job, it absorbs that tool's grammar and defaults too \u2014 deviating only where this CLI's own grammar already claimed the spelling, and saying so where it cannot comply.\n\n## Relates to\n\n- Extends [ADR-0013](0013-stdlib-flag-cli.md) (a jq engine is a library behind one flag, not the CLI framework ADR-0013 refuses)\n- See also [ADR-0021](0021-one-letter-aliases-for-rule-flags.md) (-r is --region, so the raw-string switch keeps only its long name)\n- See also [ADR-0002](0002-purego-bridge-cgo-free.md) (gojq is pure Go, so the CGO-free single binary survives the dependency)\n\n## Problem\n\n### Symptom\n\nReading one field out of a --json report costs a pipe to jq, and on a machine without jq the report has to be read by eye or copied elsewhere to be parsed at all.\n\n### Pain point\n\nThe CLI's machine-readable surface is only as portable as the binary it depends on, which defeats the point of shipping a single self-contained executable.\n\n## Decision\n\n### The lens\n\n- **Given**: every command that emits JSON is read through jq in practice, and the tool ships as one CGO-free binary\n- **We prefer**: embedding github.com/itchyny/gojq and exposing it as --jq QUERY, over executing a jq binary found on PATH, over inventing a smaller field-selector syntax, and over leaving the pipe as the only option\n- **Because**: a query that runs inside the binary works wherever the binary works, and reusing jq's grammar means there is nothing new to learn or document\n- **Unless**: a query needs a jq feature gojq does not implement, in which case the unfiltered --json and a real jq pipe are still there and still the contract\n\n### In practice\n\n- --jq implies --json, so neither ever has to be typed with the other.\n- The query is compiled before the command reads the world, so a typo costs no snapshot and moves no window.\n- A query that will not parse or compile is a usage error (exit 2); one that compiles and then fails on the data is a runtime error (exit 1).\n- Output follows jq's defaults - one result per line, two-space indent, strings quoted - and --raw is jq's -r. The letter is not offered, because -r is --region on apply (ADR-0021) and -q reads as \"quiet\" everywhere else in Unix.\n- --raw without --jq is a usage error rather than a no-op, so a script never believes it asked for unquoted strings and silently got quoted ones (ADR2.2).\n- Emitted object keys are sorted, matching jq -S rather than plain jq. gojq holds objects in Go maps, so key order cannot survive; the help text says so instead of the CLI pretending otherwise.\n- A halt in the query ends the stream cleanly; halt_error is reported like any other runtime error.\n- Filtered output still goes to stdout alone, and diagnostics still go to stderr, so --jq output stays as parseable as --json.\n\n## Consequences\n\n### Pros\n\n- The JSON surface is useful on any machine the binary runs on, which is the whole reason the binary is self-contained.\n- One quoting layer instead of two - the query is an argument, not a shell pipeline, so the shell only quotes it once.\n- Every JSON-emitting command gained the flag from one helper, so the four cannot drift apart.\n\n### Cons\n\n- The binary carries a jq implementation and its module, for a feature that a user with jq installed can already do with a pipe.\n- gojq is not bit-identical to jq - emitted object keys sort, so a consumer diffing whole objects against a real jq pipe will see a difference that is real but harmless.\n- A jq version skew now exists, because the embedded engine advances when the dependency is bumped rather than when the user upgrades their own jq.\n"}, "ADR-0028": {"file": "0028-incomplete-enumeration-blocks-only-what-it-could-change.md", "title": "An incomplete enumeration blocks only the runs it could have changed", "status": "accepted", "markdown": "# An incomplete enumeration blocks only the runs it could have changed\n\n\u003e **Lens**: A safety gate must ask whether the defect could have changed this answer, not merely whether a defect exists - a gate that fires on runs it can prove are unaffected trains people to route around it.\n\u003e Narrow such a gate by proof, never by preference: refuse unless the tool can demonstrate the gap was irrelevant, and let everything unknowable count as relevant.\n\n## Relates to\n\n- Extends [ADR-0006](0006-report-unactionable-windows.md) (keeps the guarantee and narrows its trigger to the runs the gap could actually have changed)\n- See also [ADR-0008](0008-strict-tolerance-verification.md) (both refuse to call a run successful on evidence the tool does not have)\n\n## Problem\n\n### Symptom\n\nOne application with a stale AX server made every apply exit 1, whatever the rules asked for, because the gate counted enumeration failures rather than weighing them.\n\n### Pain point\n\nThe refusal was unactionable from inside the tool - no flag, no narrowing and no rule change could clear it - so the only route to a working apply was to quit the unrelated application, and the obvious next step for a user is to stop trusting the gate.\n\n## Decision\n\n### The lens\n\n- **Given**: an application whose windows could not be read might have hidden a window some rule would have matched, and might equally have hidden nothing that could ever match\n- **We prefer**: refusing only when a rule could have matched the unread application, judged from its name and bundle id, over refusing on the mere existence of a failure, over an --allow-incomplete override that moves the judgement to the user on every run, and over dropping the gate\n- **Because**: the selector grammar already decides this - app= and bundle= terms are matched against an identity the failure report carries, so irrelevance is provable rather than assumed\n- **Unless**: nothing about the application can be established, in which case it is treated as relevant and the run refuses\n\n### In practice\n\n- Selector.CouldMatchApp is one-sided. False is a proof that no window of the application can satisfy the selector; true is only the absence of that proof.\n- A title= term never rules an application out, because a title is exactly what an unread window has not got.\n- An empty app name or bundle id never rules an application out either; an application that could not be named cannot be dismissed.\n- Every enumeration failure is still reported on stderr whether or not it blocks, so the gap is never hidden (ADR-0006).\n- A refusal now names the rule and the application that caused it, so the reason is legible instead of a bare verdict.\n- The check runs over the resolved rule set, so a profile's rules are weighed exactly like inline ones.\n- Dry-run is unchanged - it warns and previews, because it moves nothing and can promise nothing.\n\n## Consequences\n\n### Pros\n\n- The common case works - one stale application no longer holds every unrelated layout hostage.\n- The gate keeps its meaning, so it is worth obeying when it does fire; the alternative was a gate people learn to bypass.\n- A refusal is now diagnosable, naming the rule and the application rather than only the verdict.\n\n### Cons\n\n- The gate is more code and more subtlety than a count, and its correctness now rests on the selector semantics staying exact-match.\n- A rule that reaches an application only through a title= term still blocks, which is correct but will read as arbitrary next to a bundle= rule that does not.\n- A new selector key that addresses an application would have to be taught to CouldMatchApp, or it would silently stop ruling anything out.\n"}}</script>

<script>
(function () {
  "use strict";
  const read = (id) => JSON.parse(document.getElementById(id).textContent);
  const graph = read("graph-data");
  const RECORDS = read("record-data");
  const pane = document.getElementById("pane");
  // A function declaration, not a const: applyTheme() runs before the graph exists
  // and would otherwise hit the temporal dead zone.
  function css(name) {
    return getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
  }
  // Never `window.cy`: an element with id="cy" already claims that name through named
  // access on window, so the theme pass would style a <div> and throw.
  let graphInstance = null;

  if (!window.cytoscape || !window.marked) {
    document.getElementById("cy").innerHTML =
      '<p class="nofx">cytoscape.js and marked.js load from cdnjs.cloudflare.com. ' +
      "This page is otherwise self-contained; with no network the graph cannot draw. " +
      "The same records are readable as markdown in index.md.</p>";
    return;
  }

  // ---- theme -----------------------------------------------------------------
  // Both palettes are CSS custom properties in the stylesheet above, so the toggle
  // only flips which set is live. The graph re-reads them through css(), which is
  // why edge and ring colours follow the page rather than freezing at construction.
  function applyTheme(name) {
    document.documentElement.setAttribute("data-theme", name);
    try { localStorage.setItem("adr-graph-theme", name); } catch (_) { /* opaque file:// origin */ }
    if (graphInstance) style(graphInstance);
  }
  let stored = null;
  try { stored = localStorage.getItem("adr-graph-theme"); } catch (_) { /* opaque file:// origin */ }
  const preferred =
    stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(preferred);
  document.getElementById("theme").onclick = () =>
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

  // ---- elements --------------------------------------------------------------
  // graph.json carries the neutral data, compound parents included: each record
  // declares one `group`, its domain. Presentation is decided here, and both channels
  // are derived rather than assigned: fill is the domain, size is in-degree (how many
  // records refine or supersede this one). Status rides on the border, because only
  // one record is superseded and a whole colour channel would be wasted on it.
  const elements = graph.elements;
  const GROUPS = elements
    .filter((e) => String(e.data.id).startsWith("group-") )
    .map((e) => ({ id: e.data.id, label: e.data.label, colour: e.data.colour }))
    .sort((a, b) => a.label.localeCompare(b.label));

  const indegree = {};
  for (const e of elements) if (e.data.source) indegree[e.data.target] = (indegree[e.data.target] || 0) + 1;
  for (const e of elements) if (!e.data.source) e.data.weight = indegree[e.data.id] || 0;

  function style(cy) {
    cy.style([
      {
        selector: "node",
        style: {
          "background-color": "data(colour)",
          label: "data(label)",
          color: "#ffffff",
          "font-family": "ui-monospace, Menlo, monospace",
          "font-size": 10,
          "text-valign": "center",
          "text-halign": "center",
          width: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          height: (n) => 22 + Math.min(n.data("weight"), 10) * 3.4,
          "border-width": 0,
        },
      },
      {
        // A compound parent is a container, not a node: no fill of its own beyond a
        // wash of its domain colour, and its name sits above the cluster.
        selector: ":parent",
        style: {
          "background-color": "data(colour)",
          "background-opacity": 0.07,
          "border-width": 1,
          "border-color": "data(colour)",
          "border-opacity": 0.45,
          "border-style": "dashed",
          shape: "round-rectangle",
          padding: 14,
          label: "data(label)",
          color: "data(colour)",
          // A resolved stack, not var(--body): cytoscape draws to a canvas and
          // cannot resolve a CSS custom property, so it rejects the whole rule.
          "font-family": css("body"),
          "font-size": 12,
          "font-weight": "bold",
          "text-valign": "top",
          "text-halign": "center",
          "text-margin-y": -4,
        },
      },
      {
        // The one status that is not "accepted" earns a ring rather than a hue.
        selector: 'node[status = "superseded"]',
        style: { "border-width": 3, "border-color": css("bad"), "border-opacity": 1 },
      },
      {
        selector: "edge",
        style: {
          width: 1.4,
          "line-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-color": (e) => (e.data("relation").startsWith("supersede") ? css("bad") : css("accent")),
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,
          "curve-style": "bezier",
          "line-style": (e) => (e.data("relation").startsWith("supersede") ? "solid" : "dashed"),
          opacity: 0.5,
        },
      },
      { selector: "node.sel", style: { "border-width": 4, "border-color": css("ink"), "border-opacity": 1 } },
      { selector: ":parent.dim", style: { "background-opacity": 0.02, "border-opacity": 0.12, "text-opacity": 0.25 } },
      { selector: "node.dim, edge.dim", style: { opacity: 0.15 } },
      { selector: "edge.hot", style: { opacity: 1, width: 2.4 } },
      { selector: "node.hot", style: { opacity: 1 } },
    ]);
  }

  // ---- the grouped layout ------------------------------------------------------
  // Computed here rather than left to a force layout, for two reasons. Cytoscape's
  // built-in `cose` is only nominally compound-aware: records whose edges reach across
  // domains get dragged out of their own cluster, which collapsed several groups to a
  // few pixels. And a force layout is non-deterministic, so a committed generated file
  // would draw a different picture on every rebuild. The purpose-built compound
  // layouts (fcose, cose-bilkent) are not on the CDN this page is allowed to use.
  //
  // Shelf packing: each domain becomes a grid of its records, the grids are laid out
  // left to right and wrapped, and every position is a pure function of the sorted
  // record ids. Same input, same picture, every time.
  const SLOT = 66;          // one record's cell, in graph units
  const GAP = 46;           // between domain boxes

  function groupedPositions() {
    const boxes = GROUPS.map((g) => {
      const kids = elements
        .filter((e) => e.data.parent === g.id)
        .map((e) => e.data.id)
        .sort();
      const cols = Math.max(1, Math.ceil(Math.sqrt(kids.length)));
      const rows = Math.ceil(kids.length / cols);
      return { ...g, kids, cols, rows, w: cols * SLOT, h: rows * SLOT };
    });

    // Wrap width is derived from the total area and the pane's aspect ratio, so the
    // arrangement stays roughly as wide as the space it has to fit into. A fixed width
    // produced a long thin strip that fitted to almost nothing in a tall pane.
    const area = boxes.reduce((a, b) => a + (b.w + GAP) * (b.h + GAP), 0);
    const box = document.getElementById("cy").getBoundingClientRect();
    const aspect = box.width && box.height ? box.width / box.height : 1;
    const shelf = Math.max(
      Math.max(...boxes.map((b) => b.w)),
      Math.sqrt(area * Math.max(aspect, 0.6)),
    );

    const pos = {};
    let x = 0, y = 0, shelfHeight = 0;
    for (const b of boxes) {
      if (x > 0 && x + b.w > shelf) { x = 0; y += shelfHeight + GAP; shelfHeight = 0; }
      b.kids.forEach((id, i) => {
        pos[id] = {
          x: x + (i % b.cols) * SLOT + SLOT / 2,
          y: y + Math.floor(i / b.cols) * SLOT + SLOT / 2,
        };
      });
      x += b.w + GAP;
      shelfHeight = Math.max(shelfHeight, b.h);
    }
    return pos;
  }

  const GROUPED = {
    name: "preset",
    positions: (n) => groupedPositions()[n.id()],
    padding: 40,
    animate: false,
    fit: true,
  };

  const cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    layout: GROUPED,
    wheelSensitivity: 0.2,
  });
  graphInstance = cy;
  window.__adrGraph = cy;  // the browser check reaches the instance through this
  style(cy);

  // ---- selection -------------------------------------------------------------
  function show(id) {
    const rec = RECORDS[id];
    if (!rec) return;
    cy.batch(() => {
      cy.elements().removeClass("sel hot dim").addClass("dim");
      const node = cy.getElementById(id);
      node.removeClass("dim").addClass("sel hot");
      node.connectedEdges().removeClass("dim").addClass("hot").connectedNodes().removeClass("dim").addClass("hot");
    });
    pane.classList.remove("empty");
    pane.innerHTML =
      '<div class="meta"><span class="chip">' + id + '</span>' +
      '<span class="chip ' + rec.status + '">' + rec.status + "</span>" +
      '<a class="chip" href="' + rec.file + '">' + rec.file + "</a></div>" +
      '<div id="doc">' + marked.parse(rec.markdown) + "</div>";
    // A link to another record navigates the graph instead of leaving the page. Scoped to
    // the rendered body: the chip above links to this record's own file and must keep its
    // native behaviour, or it would rewire into a no-op that reselects the current record.
    for (const a of pane.querySelectorAll('#doc a[href$=".md"]')) {
      const target = Object.keys(RECORDS).find((k) => RECORDS[k].file === a.getAttribute("href"));
      if (!target) continue;
      a.classList.add("adr");
      a.addEventListener("click", (ev) => { ev.preventDefault(); select(target); });
    }
    pane.scrollTop = 0;
  }

  function select(id) {
    show(id);
    history.replaceState(null, "", "#" + id);
    const n = cy.getElementById(id);
    if (n.length) {
      cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 0.75) }, { duration: 220 });
    }
  }

  cy.on("tap", "node", (ev) => select(ev.target.id()));
  cy.on("tap", (ev) => {
    if (ev.target !== cy) return;
    cy.elements().removeClass("sel hot dim");
    pane.classList.add("empty");
    pane.innerHTML = "<p>Select a record to read it.<br>Links between records navigate the graph.</p>";
    history.replaceState(null, "", "#");
  });

  // ---- controls --------------------------------------------------------------
  // One chip per domain. Clicking isolates that domain; clicking again restores the
  // whole graph. Counts come from the elements, so the legend cannot disagree with them.
  const nav = document.getElementById("groups");
  let isolated = null;
  for (const g of GROUPS) {
    const count = cy.getElementById(g.id).children().length;
    const chip = document.createElement("button");
    chip.className = "gchip";
    chip.type = "button";
    chip.setAttribute("aria-pressed", "false");
    chip.dataset.group = g.id;
    chip.innerHTML =
      '<span class="sw" style="background:' + g.colour + '"></span>' + g.label +
      ' <span class="n">' + count + "</span>";
    chip.onclick = () => {
      isolated = isolated === g.id ? null : g.id;
      for (const c of nav.children) c.setAttribute("aria-pressed", String(c.dataset.group === isolated));
      cy.batch(() => {
        cy.elements().removeClass("dim");
        if (!isolated) return;
        const keep = cy.getElementById(isolated).children();
        cy.elements().addClass("dim");
        keep.removeClass("dim");
        cy.getElementById(isolated).removeClass("dim");
        // Only edges with both ends inside the domain. A cross-domain edge left lit
        // terminates at a node that is no longer drawn, which reads as a stray line.
        keep.edgesWith(keep).removeClass("dim");
      });
    };
    nav.appendChild(chip);
  }

  document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
  document.getElementById("layout").onchange = (ev) => {
    const choice = ev.target.value;
    // The alternates are force- or tree-based and ignore compound containment, so the
    // domain boxes stretch to wherever their records land. That is a fair view of the
    // relation structure; `grouped` is the one that keeps the domains legible.
    cy.layout(
      choice === "grouped"
        ? GROUPED
        : {
            name: choice, animate: false, padding: 30, directed: true, spacingFactor: 1.15,
            nodeRepulsion: 12000, idealEdgeLength: 70, nestingFactor: 1.2, numIter: 1000,
          },
    ).run();
    cy.fit(undefined, 30);
  };

  document.getElementById("q").addEventListener("input", (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    cy.batch(() => {
      if (!q) { cy.elements().removeClass("dim"); return; }
      cy.nodes().forEach((n) => {
        if (n.isParent()) { n.addClass("dim"); return; }
        const hit =
          n.id().toLowerCase().includes(q) ||
          (n.data("title") || "").toLowerCase().includes(q) ||
          (n.data("group") || "").toLowerCase().includes(q);
        n.toggleClass("dim", !hit);
      });
      cy.edges().addClass("dim");
    });
  });

  window.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { document.getElementById("q").value = ""; cy.elements().removeClass("dim"); }
    if (ev.key === "/" && document.activeElement !== document.getElementById("q")) {
      ev.preventDefault(); document.getElementById("q").focus();
    }
  });

  // The hash is the address. Honour it on load and on every later change, so the browser's
  // back and forward buttons walk the reading history and a pasted link opens its record.
  function fromHash() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[id]) show(id);
  }
  window.addEventListener("hashchange", fromHash);

  // Fit once the first layout has settled, then honour any deep link. Fitting before
  // the layout runs measures an empty extent and leaves the graph off-screen.
  cy.ready(() => {
    cy.fit(undefined, 30);
    const deep = decodeURIComponent(location.hash.slice(1));
    if (RECORDS[deep]) select(deep);
  });
  window.addEventListener("resize", () => cy.fit(undefined, 30));
})();
</script>
</body>
</html>
